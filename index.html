const NOTES=[
["fed","Exam format","National Test with Uniform State Content: 125 questions (115 scored + 10 unscored pilot), 190 minutes, passing 75%. Retake waits: 30 days after 1st and 2nd fail, 180 days after 3rd. Content weights: Federal law 24%, Uniform State Content 11%, General knowledge 20%, Origination activities 27%, Ethics 18%. (This app's mock = 120 questions/190 min.)"],
["fed","RESPA (Reg X)","Covers federally related 1–4 family mortgages. Sec. 8: no kickbacks, referral fees or unearned fee splits (payment for services actually performed is OK). Sec. 9: seller can't require a specific title insurer. Affiliated Business Arrangement disclosure required; can't require use. Home Loan Toolkit within 3 business days (purchases). Escrow: cushion max 1/6 of annual disbursements; annual analysis; surplus ≥$50 refunded within 30 days. Servicing transfer notice: 15 days before (old servicer) / 15 days after (new). QWR/notice of error: acknowledge 5 business days, respond 30 business days. No first foreclosure filing until >120 days delinquent. Force-placed insurance requires notices (45 days + 15-day reminder)."],
["fed","TILA (Reg Z) & TRID","TILA = disclosure of credit cost (APR, finance charge). APR tolerance 1/8% regular, 1/4% irregular. Finance charge includes interest, points, MI; excludes appraisal, credit report, title, notary. Right of rescission: refinance/HELOC on principal dwelling (not purchase), 3 business days after latest of signing, notice, disclosures (up to 3 years if missing). Advertising triggering terms (down payment, # of payments/term, payment amount, finance charge) → must disclose down payment, repayment terms, APR.<br><b>TRID</b>: Application = 6 items (name, income, SSN, address, value, loan amount). LE within 3 business days of application; 7 business days before consummation. Only a credit report fee before LE + intent to proceed. CD received 3 business days before consummation. New 3-day wait if APR inaccurate, product change, or prepayment penalty added. Revised LE within 3 business days of changed circumstance and received 4 business days before consummation. Tolerances: Zero = lender/broker/affiliate fees, non-shoppable services, transfer taxes; 10% aggregate = recording fees + services from lender's list; Unlimited = prepaids, escrow deposits, insurance, services borrower shops for off-list. Mailbox rule: received 3 business days after mailing. Not covered: HELOCs, reverse mortgages, chattel mobile homes."],
["fed","LO Compensation & Anti-Steering","No compensation based on loan terms or proxies (fixed % of loan amount OK, with min/max). No dual compensation (borrower-paid excludes creditor-paid). Safe harbor: present lowest rate, lowest rate without risky features, lowest points/fees. LO name and NMLS ID on application, note, security instrument."],
["fed","HOEPA / HPML","<b>HOEPA high-cost</b> (Section 32): APR > APOR + 6.5 (first lien) / +8.5 (subordinate); or points & fees >5% (loans ≥ indexed threshold) or 8%/$ amount for smaller loans; or prepayment penalty beyond 36 months/2%. Requires counseling; bans balloons (mostly), prepayment penalties, negative amortization, financing points/fees. <b>HPML</b> (Section 35): APR ≥ APOR +1.5 first lien conforming, +2.5 jumbo, +3.5 subordinate. Escrow required 5 years; interior appraisal by certified/licensed appraiser; second appraisal for flips (90 days >10%, 91–180 days >20%)."],
["fed","ATR / QM","ATR: 8 factors—income/assets, employment, monthly payment, simultaneous loans, mortgage-related obligations, debts/alimony/child support, DTI or residual income, credit history. Qualify ARMs at greater of fully indexed or intro rate with fully amortizing payment. QM: no neg-am, IO, balloon (except small creditor), term ≤30 yrs, points/fees ≤3% (larger loans). General QM (price-based): APR < APOR + 2.25 for most first liens. Safe harbor if APR < APOR +1.5; rebuttable presumption if higher-priced."],
["fed","ECOA (Reg B)","Prohibited bases: race, color, religion, national origin, sex, marital status, age (if can contract), public assistance income, exercising consumer credit rights. Notice of action within 30 days of complete application. Can't require spouse signature if applicant qualifies alone. Marital status terms on secured credit: married, unmarried, separated. Must tell applicant alimony/child support needn't be disclosed unless relied upon. Valuations rule: notice within 3 business days of application; copy of appraisals promptly or 3 business days before consummation. Record retention 25 months."],
["fed","HMDA (Reg C)","Collect/report application data (LAR) incl. demographics; purposes: whether lenders serve community housing needs, help public officials target investment, identify discriminatory patterns. If applicant declines in person → visual observation/surname."],
["fed","FCRA / FACTA","Permissible purpose needed to pull credit. Adverse action based on report → CRA name/contact, CRA didn't decide, free report within 60 days, right to dispute; credit score disclosure. FACTA: free annual reports, fraud alerts, Red Flags Rule (identity theft program), disposal rule, risk-based pricing notice."],
["fed","GLBA","Privacy Rule: initial privacy notice and annual (unless exception); opt-out of NPI sharing with nonaffiliated third parties. Safeguards Rule: written information security program. Pretexting provisions ban obtaining info under false pretenses."],
["fed","BSA / AML","Nonbank residential mortgage lenders/originators must have AML programs and file SARs (since 2012). SAR: suspicious transactions ≥ $5,000; file within 30 days of detection (60 if no suspect); never tip off; keep 5 years. CTR: cash > $10,000. Structuring is a crime. Laundering stages: placement, layering, integration."],
["fed","Other federal","<b>HPA</b>: PMI cancel on request at 80% of original value, auto at 78%, final at midpoint. <b>Fair Housing Act</b>: race, color, religion, sex, handicap, familial status, national origin. <b>TCPA/DNC</b>: scrub every 31 days; calls 8am–9pm; EBR 18 months after transaction, 3 months after inquiry. <b>CAN-SPAM</b>: opt-out honored 10 business days. <b>E-SIGN</b>: consumer consent for electronic disclosures. <b>MAP Rule (Reg N)</b>: no deceptive mortgage ads; keep ads 24 months. <b>Dodd-Frank</b>: created CFPB, UDAAP, ATR/QM. <b>SAFE Act</b> (2008, HERA): Reg G (federal registration, bank MLOs), Reg H (state licensing)."],
["state","SAFE Act & Model State Law","MLO = individual who takes an application AND offers/negotiates terms for compensation. Exempt: own residence, immediate family, clerical staff, W-2 processors under supervision, attorneys (unless compensated by lender), real estate licensees not compensated by lender. Independent contractor processors must be licensed. Licensing: fingerprints/FBI, credit report, never had MLO license revoked, no felony in 7 yrs, no fraud/dishonesty/breach of trust/money laundering felony ever (pardons don't count), financial responsibility/character/fitness, 20 hrs PE (3 fed, 3 ethics, 2 nontraditional, 12 elective), pass test ≥75%, surety bond/net worth via employer. Retest if no license for 5 years. Renewal annually by Dec 31; 8 hrs CE (3 fed, 2 ethics, 2 nontraditional, 1 elective); no same course same/successive years; instructors 2 hrs per hour taught. NMLS unique ID on applications, ads, solicitations. Mortgage Call Report quarterly within 45 days. Temporary authority: 120 days. Regulator powers: investigate, subpoena, C&D, suspend/revoke, civil penalties up to $25,000 per violation. CFPB is federal backstop. NMLS info keeps privilege/confidentiality. Ohio note: Ohio requires state-specific PE/CE hours in addition to the national requirements (check Ohio Division of Financial Institutions)."],
["gen","Loan types","<b>FHA</b> (HUD insures): 3.5% down at 580+, 10% at 500–579; UFMIP 1.75%; annual MIP (life of loan if <10% down, 11 yrs if ≥10%); owner-occupied 1–4 units; seller concessions up to 6%; assumable; 203(k) rehab; streamline refi. <b>VA</b>: COE, 0% down, no monthly MI, funding fee (exempt for disabled vets), residual income, 41% DTI benchmark, IRRRL, assumable. <b>USDA</b> 502 Guaranteed: eligible rural areas, income ≤115% AMI, 0% down, 1% upfront / 0.35% annual fee. <b>Conventional</b>: not government-backed; conforming (FHFA limits, Fannie/Freddie) vs jumbo; PMI >80% LTV. <b>Ginnie Mae</b> guarantees MBS of government loans; FHFA regulates GSEs."],
["gen","Products & terms","ARMs: index + margin = fully indexed rate; caps (initial/periodic/lifetime e.g., 2/2/5); 5/1 = fixed 5 yrs, adjusts yearly. Nontraditional = anything other than 30-yr fixed. Negative amortization, interest-only, balloon, HELOC (draw + repayment), reverse mortgage (HECM age 62+, counseling), bridge, construction-to-perm, buydowns (2-1: 2% below yr1, 1% yr2), non-QM. Note = promise to pay; mortgage/deed of trust = security. Clauses: acceleration, alienation (due-on-sale), subordination, prepayment. Point = 1% of loan amount. Lender credits trade higher rate for lower costs. Appraisal approaches: sales comparison (homes), cost (new/special), income (rentals). Flood insurance in SFHAs. Lender's title policy protects lender."],
["orig","Application & underwriting","URLA/1003; 4506-C (tax transcripts); VOE/VOD; 1008 summary; DU (Fannie), LPA (Freddie), TOTAL (FHA), GUS (USDA). 4 C's: credit, capacity, capital, collateral. 2-yr employment history; self-employed: 2 yrs tax returns averaged. Gift letter: donor, relationship, amount, no repayment. Seasoned funds 60 days; source large deposits. Reserves = months of PITI. Middle credit score. Alimony/child support must continue ≥3 years. Rental income often at 75%. FHA deferred student loans: 0.5% of balance if $0 payment."],
["orig","Calculations cheat sheet","LTV = loan ÷ lesser of price or appraised value. CLTV = all liens ÷ value. Front-end = PITI ÷ gross monthly income; back-end = (PITI + monthly debts) ÷ income. Monthly income: hourly × hrs × 52 ÷ 12; biweekly × 26 ÷ 12; semimonthly × 24 ÷ 12. Points = % of loan amount. Break-even = cost ÷ monthly savings. Per diem = loan × rate ÷ 365 (or 360). Monthly interest = loan × rate ÷ 12. Prepaid interest: closing day through end of month (interest paid in arrears). Escrow cushion ≤ 1/6 annual. Prorations: daily amount × days owed. ARM max = start + lifetime cap."],
["orig","Disclosure timing","Day 0 application → LE by business day 3 (business day = office open). Consummation ≥7 business days after LE. CD received ≥3 business days (all days but Sundays/holidays) before consummation. Mailed = received 3 business days later. Rescission: 3 business days after signing; fund after. Adverse action 30 days. Appraisal copy 3 business days before closing."],
["ethics","Fraud & ethics","Fraud for profit (insiders) vs fraud for housing (borrower). Types: occupancy fraud, straw buyer, air loan, silent second, illegal flipping, shotgunning, builder bailout, undisclosed cash back, identity theft/synthetic ID, foreclosure rescue / equity skimming, appraisal inflation. Red flags: income inconsistent with job, SSN issued before DOB, round paystub numbers, distant comps, frequent recent transfers, quick-flip ownership. Predatory: flipping (churning), packing, equity stripping, steering, reverse redlining. Fair lending: disparate treatment vs disparate impact; redlining. UDAAP: unfair (substantial injury, not avoidable, not outweighed), deceptive (misleads reasonable consumer, material), abusive (interferes with understanding / takes unreasonable advantage). RESPA: no gifts for referrals; co-marketing pro rata. Appraiser independence: no pressure; reconsideration of value OK. Ads: NMLS ID, no misleading 'fixed', teaser disclosure. Penalties: 18 USC 1014 up to $1M / 30 years."]
];

// ---- Readiness score (modeled on CE Shop competency score / Prep xL "90% before testing" guidance)
function readiness(){let tot=0,cov=0;for(const t in TOPICS){const s=topicStats(t);const w=TOPICS[t][1]/100;tot+=w*(s.p||0)*Math.min(1,s.seen/Math.max(1,s.n*0.6));cov+=w*s.seen/s.n}

()=>{const ann=R_(1800,9000,10),c=Math.round(ann/6*100)/100;return["Annual property taxes + insurance escrowed total "+$f(ann)+". Under RESPA, maximum escrow cushion?",c,"$","Max cushion = 1/6 of annual disbursements (2 months) = "+$f(c)+"."]},
()=>{const v=R_(250000,600000,5000),f=R_(60,80,5),s=R_(5,15,5),l1=v*f/100,l2=v*s/100;return["Value "+$f(v)+", first mortgage "+$f(l1)+", second mortgage "+$f(l2)+". CLTV?",f+s,"%","CLTV = (all liens) ÷ value = "+$f(l1+l2)+" ÷ "+$f(v)+" = "+(f+s)+"%."]}];
function v_math(){const m=S.math;app.innerHTML=`<div class="card"><h2>Math Drill</h2><p>Unlimited randomized LTV/CLTV, DTI, points, interest, prepaid interest, ARM caps and escrow cushion problems. Show your work; answers within 0.1 (or $1) count.</p><p>Lifetime: ${m.c} right / ${m.c+m.w}</p><button class="btn" onclick="runMath()">Start drill</button></div>`}
function runMath(){let n=0,r=0;function show(){const [q,a,u,e]=MATH[R_(0,MATH.length-1)]();n++;
app.innerHTML=`<div class="card"><small>Problem ${n} · ${r} right</small><h3>${q}</h3><p>${u=="$"?"$":""}<input id="ma" inputmode="decimal" style="font-size:1.1rem;padding:8px;width:160px">${u=="%"?" %":""}</p><button class="btn" id="mc">Check</button><button class="btn alt" onclick="nav('math')">Quit</button><div id="me"></div></div>`;$("ma").focus();
$("mc").onclick=()=>{const v=parseFloat($("ma").value.replace(/[$,%\s]/g,""));const ok=Math.abs(v-a)<=(u=="$"?1:0.1);{const m=S.dm[DEV]||(S.dm[DEV]=[0,0]);ok?(r++,m[0]++):m[1]++;rebuild();save()}
$("me").innerHTML=`<div class="exp"><b>${ok?"Correct!":"Answer: "+(u=="$"?$f(a):a+"%")}</b><br>${e}</div><button class="btn" id="mn">Next</button>`;$("mc").remove();$("mn").onclick=show}}show()}
function v_dash(){let h=readyCard()+syncCard()+`<div class="card"><h2>Progress by topic</h2><table><tr><th>Topic (weight)</th><th>Seen</th><th>Accuracy</th><th>My confidence</th></tr>`;
for(const t in TOPICS){const s=topicStats(t);h+=`<tr><td>${TOPICS[t][0]} (${TOPICS[t][1]}%)</td><td>${s.seen}/${s.n}</td><td>${s.p==null?"—":s.p+"%"}<div class="bar"><i style="width:${s.p||0}%;background:${s.p>=75?'#1e8e3e':'#f9a825'}"></i></div></td><td>${confRow(t)}</td></tr>`}
h+=`</table><p>Missed questions to review: <b>${Object.values(S.missed).filter(x=>x).length}</b></p></div><div class="card"><h3>Exam simulator history</h3>`;
h+=S.exams.length?`<table>${S.exams.slice().reverse().map(e=>`<tr><td>${e.d}</td><td class="${e.p>=75?'pass':'fail'}">${e.p}% ${e.p>=75?'PASS':'FAIL'}</td><td>${e.m} min</td></tr>`).join("")}</table>`:"<p>No simulators yet.</p>";
h+=`</div><div class="card"><button class="btn" onclick="nav('quiz')">Practice</button><button class="btn" onclick="nav('mock')">Exam simulator</button><button class="btn alt" onclick="exportP()">Export backup</button><button class="btn alt" onclick="$('imp').click()">Import backup</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importP(this)"><button class="btn alt" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(K);location.reload();nav('dash')}">Reset progress</button></div>`;app.innerHTML=h}
function v_notes(){app.innerHTML=Object.keys(TOPICS).map(t=>`<h3>${TOPICS[t][0]} — ${TOPICS[t][1]}%</h3>`+NOTES.filter(n=>n[0]==t).map(n=>`<details><summary>${n[1]}</summary><p>${n[2]}</p></details>`).join("")).join("")}
function v_quiz(){app.innerHTML=`<div class="card"><h2>Quiz by topic</h2><p><select id="qt"><option value="all">All topics</option>${Object.keys(TOPICS).map(t=>`<option value="${t}">${TOPICS[t][0]} (${Q.filter(q=>q[0]==t).length})</option>`).join("")}</select></p>
<p><select id="qn"><option>10</option><option selected>25</option><option>50</option><option value="999">All</option></select> questions &nbsp; <label><input type="checkbox" id="qu"> Unseen/weak first</label></p><p><label><input type="radio" name="qm" id="qms" checked> Study mode (instant answer + explanation)</label><br><label><input type="radio" name="qm" id="qme"> Exam mode (score & explanations at the end)</label></p><button class="btn" onclick="startQuiz()">Start</button></div>`}
function startQuiz(pool){const t=pool?null:$("qt").value,n=pool?999:+$("qn").value;let p=pool||Q.filter(q=>t=="all"||q[0]==t);p=shuf(p);
if(!pool&&$("qu").checked)p.sort((a,b)=>score(a)-score(b));runPractice(p.slice(0,n),pool?"review":"quiz",!pool&&$("qme").checked)}

function runPractice(list,back,exam){if(exam)return runExamQuiz(list,back);let i=0,right=0;const opts=list.map(q=>shuf([0,1,2,3]));
function show(){if(i>=list.length){app.innerHTML=`<div class="card"><h2>Done: ${right}/${list.length} (${Math.round(100*right/list.length)}%)</h2><button class="btn" onclick="nav('${back}')">Back</button><button class="btn alt" onclick="nav('dash')">Dashboard</button></div>`;return}
const q=list[i];app.innerHTML=`<div class="card"><div><span class="tag">${TOPICS[q[0]][0]}</span> <span class="tag">${q[1]}</span> <small>Q ${i+1}/${list.length} · score ${right}</small></div><h3>${esc(q[2])}</h3><div id="op">${opts[i].map(k=>`<button class="opt" data-k="${k}">${esc(q[3][k])}</button>`).join("")}</div><div id="ex"></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if($("ex").innerHTML)return;const k=+b.dataset.k,ok=k==q[4];if(ok)right++;rec(q,ok);
app.querySelectorAll(".opt").forEach(x=>{if(+x.dataset.k==q[4])x.classList.add("c")});if(!ok)b.classList.add("w");
$("ex").innerHTML=`<div class="exp"><b>${ok?"Correct!":"Incorrect."}</b> ${esc(q[5])}</div><button class="btn" id="nx">Next</button><button class="btn alt" id="bmk">${S.bm[q.id]?"★ Saved":"☆ Save"}</button><button class="btn alt" onclick="nav('${back}')">Quit</button>`;$("bmk").onclick=()=>{setKV("bm",q.id,S.bm[q.id]?0:1);$("bmk").textContent=S.bm[q.id]?"★ Saved":"☆ Save"};$("nx").onclick=()=>{i++;show()}})}show()}

function runExamQuiz(list,back){let i=0;const ans={},opts=list.map(()=>shuf([0,1,2,3]));
function show(){if(i>=list.length){let c=0;list.forEach((q,j)=>{const ok=ans[j]===q[4];if(ok)c++;rec(q,ok)});
app.innerHTML=`<div class="card"><h2>${c}/${list.length} (${Math.round(100*c/list.length)}%)</h2><button class="btn" onclick="nav('${back}')">Back</button></div>`+list.map((q,j)=>ans[j]===q[4]?"":`<div class="card"><p><b>${esc(q[2])}</b></p><p class="fail">Yours: ${ans[j]==null?"(blank)":esc(q[3][ans[j]])}</p><p class="pass">Correct: ${esc(q[3][q[4]])}</p><div class="exp">${esc(q[5])}</div></div>`).join("");return}
const q=list[i];app.innerHTML=`<div class="card"><small>Q ${i+1}/${list.length} · exam mode</small><h3>${esc(q[2])}</h3>${opts[i].map(k=>`<button class="opt ${ans[i]===k?'sel':''}" data-k="${k}">${esc(q[3][k])}</button>`).join("")}<button class="btn" id="nx">${i==list.length-1?"Finish":"Next ▶"}</button></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;show()});$("nx").onclick=()=>{i++;show()}}show()}
function v_review(){const m=Q.filter(q=>S.missed[q.id]),bk=Q.filter(q=>S.bm[q.id]);app.innerHTML=`<div class="card"><h2>Missed questions (${m.length})</h2><p>Answer correctly to clear a question from this list.</p>${m.length?`<button class="btn" onclick="startQuiz(Q.filter(q=>S.missed[q.id]))">Drill missed questions</button>`:""}${bk.length?`<button class="btn alt" onclick="startQuiz(Q.filter(q=>S.bm[q.id]))">Drill ${bk.length} saved ★</button>`:""}</div>`+m.map(q=>`<div class="card"><span class="tag">${TOPICS[q[0]][0]}</span><p><b>${esc(q[2])}</b></p><p>✔ ${esc(q[3][q[4]])}</p><div class="exp">${esc(q[5])}</div></div>`).join("")}
const MOCK={fed:30,state:14,gen:25,orig:33,ethics:23};const MN=125;
function v_mock(){const s=JSON.parse(localStorage.getItem(K+"_mock")||"null");app.innerHTML=`<div class="card"><h2>Exam Simulator</h2><p>125 questions (like the real test & MEC/Prep xL simulators) · 190 minutes · weighted by the NMLS outline (Federal ${MOCK.fed}, State ${MOCK.state}, General ${MOCK.gen}, Origination ${MOCK.orig}, Ethics ${MOCK.ethics}). Passing: 75%. No feedback until you submit; you can flag and revisit questions.</p>
<button class="btn" onclick="newMock()">Start new mock exam</button>${s?`<button class="btn alt" onclick="runMock()">Resume exam in progress</button>`:""}</div>`}
function newMock(){let ids=[];for(const t in MOCK)ids=ids.concat(shuf(Q.filter(q=>q[0]==t)).slice(0,MOCK[t]).map(q=>q.id));ids=shuf(ids);
localStorage.setItem(K+"_mock",JSON.stringify({ids,ord:ids.map(()=>shuf([0,1,2,3])),ans:{},fl:{},end:Date.now()+190*60000,start:Date.now(),i:0}));runMock()}
function runMock(){const M=JSON.parse(localStorage.getItem(K+"_mock"));const sv=()=>localStorage.setItem(K+"_mock",JSON.stringify(M));
function tick(){const r=M.end-Date.now();if(r<=0){finish();return}const e=$("tm");if(e)e.textContent=Math.floor(r/60000)+":"+String(Math.floor(r/1000)%60).padStart(2,"0")}
clearInterval(timerInt);timerInt=setInterval(tick,1000);
function show(){const q=Q[M.ids[M.i]];const a=M.ans[M.i];const done=Object.keys(M.ans).length;
app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><span>Q ${M.i+1}/${M.ids.length} · answered ${done}</span><span class="timer">⏱ <span id="tm"></span></span></div><h3>${esc(q[2])}</h3>${M.ord[M.i].map(k=>`<button class="opt ${a===k?'sel':''}" data-k="${k}">${esc(q[3][k])}</button>`).join("")}
<button class="btn alt" id="pv">◀ Prev</button><button class="btn" id="nx">Next ▶</button><button class="btn alt" id="fl">${M.fl[M.i]?"Unflag":"Flag"}</button><button class="btn" style="background:#c62828" id="sb">Submit exam</button></div><div class="card grid">${M.ids.map((_,j)=>`<b class="${M.ans[j]!=null?'a':''} ${M.fl[j]?'f':''}" data-j="${j}">${j+1}</b>`).join("")}</div>`;tick();
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{M.ans[M.i]=+b.dataset.k;sv();show()});
$("pv").onclick=()=>{if(M.i>0){M.i--;sv();show()}};$("nx").onclick=()=>{if(M.i<M.ids.length-1){M.i++;sv();show()}};$("fl").onclick=()=>{M.fl[M.i]=!M.fl[M.i];sv();show()};
$("sb").onclick=()=>{if(confirm(`Submit? ${M.ids.length-done} unanswered.`))finish()};app.querySelectorAll(".grid b").forEach(b=>b.onclick=()=>{M.i=+b.dataset.j;sv();show()})}
function finish(){clearInterval(timerInt);let c=0;const bt={};M.ids.forEach((id,j)=>{const q=Q[id],ok=M.ans[j]===q[4];if(ok)c++;rec(q,ok);const b=bt[q[0]]||(bt[q[0]]={c:0,n:0});b.n++;if(ok)b.c++});
const p=Math.round(1000*c/M.ids.length)/10,m=Math.round((Math.min(Date.now(),M.end)-M.start)/60000);S.exams.push({id:M.start+"-"+DEV,d:new Date().toLocaleDateString(),p,m});save();localStorage.removeItem(K+"_mock");
app.innerHTML=`<div class="card"><h2 class="${p>=75?'pass':'fail'}">${p}% — ${p>=75?"PASS":"Below 75%"}</h2><p>${c}/${M.ids.length} correct in ${m} minutes.</p><table>${Object.keys(bt).map(t=>`<tr><td>${TOPICS[t][0]}</td><td>${bt[t].c}/${bt[t].n} (${Math.round(100*bt[t].c/bt[t].n)}%)</td></tr>`).join("")}</table><button class="btn" onclick="nav('review')">Review missed</button></div>`+
M.ids.map((id,j)=>{const q=Q[id];if(M.ans[j]===q[4])return"";return`<div class="card"><p><b>${j+1}. ${esc(q[2])}</b></p><p class="fail">Your answer: ${M.ans[j]==null?"(blank)":esc(q[3][M.ans[j]])}</p><p class="pass">Correct: ${esc(q[3][q[4]])}</p><div class="exp">${esc(q[5])}</div></div>`}).join("")}
show()}
function v_plan(){const st=new Date(2026,9,20);app.innerHTML=`<div class="card"><h2>14-Day Study Plan</h2><p>Oct 20 → Nov 2, 2026. ~1.5–2.5 hrs/day. Check off each day.</p></div>`+PLAN.map((p,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);return`<div class="card"><label><input type="checkbox" ${S.plan[i]?"checked":""} onchange="setKV('plan',${i},this.checked)"> <b>Day ${i+1} — ${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</b></label><p>${p}</p></div>`}).join("")}
function exportP(){const b=new Blob([JSON.stringify({app:"safemlo",v:1,S,mock:localStorage.getItem(K+"_mock")})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="safe-mlo-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove()}
function importP(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.app!="safemlo"||!d.S||!d.S.st)throw 0;if(!confirm("Replace current progress with this backup?"))return;localStorage.setItem(K,JSON.stringify(d.S));if(d.mock)localStorage.setItem(K+"_mock",d.mock);alert("Progress restored.");location.reload()}catch(e){alert("Not a valid SAFE MLO backup file.")}});inp.value=""}

// ===== Cross-device sync (textdb.online, keyed by a private sync code) =====
const SK=K+"_sync",SYNC_URL="https://textdb.online/";let syncTimer=null,syncBusy=false;
const syncCode=()=>localStorage.getItem(SK)||"";const syncKey=c=>"safemlo-"+c.toLowerCase().replace(/[^a-z0-9]/g,"");
function setStatus(t){localStorage.setItem(SK+"_st",t);const e=document.getElementById("syncst");if(e)e.textContent=t}
function mergeS(a,b){// merge remote b into local a (returns new)
const o=JSON.parse(JSON.stringify(a));o.dc=o.dc||{};for(const d in b.dc||{}){const L=o.dc[d]||(o.dc[d]={}),Rm=b.dc[d];for(const id in Rm){const x=L[id]||[0,0],y=Rm[id];L[id]=[Math.max(x[0],y[0]),Math.max(x[1],y[1])]}}
o.dm=o.dm||{};for(const d in b.dm||{}){const x=o.dm[d]||[0,0],y=b.dm[d];o.dm[d]=[Math.max(x[0],y[0]),Math.max(x[1],y[1])]}
o.ts=o.ts||{};for(const f of["missed","bm","conf","fc","plan"]){o[f]=o[f]||{};const bf=(b[f])||{};for(const k in bf){const tk=f+":"+k,tb=(b.ts||{})[tk]||0,ta=o.ts[tk]||0;if(!(k in o[f])||tb>ta){o[f][k]=bf[k];if(tb)o.ts[tk]=tb}}}
const ex={};(o.exams||[]).concat(b.exams||[]).forEach(e=>{ex[e.id||(e.d+"|"+e.p+"|"+e.m)]=e});o.exams=Object.values(ex).sort((x,y)=>String(x.id||"").localeCompare(String(y.id||"")));return o}
async function syncNow(){const c=syncCode();if(!c||syncBusy)return;if(!navigator.onLine){setStatus("Offline — will sync when back online");return}syncBusy=true;
try{const r=await fetch(SYNC_URL+syncKey(c)+"?_="+Date.now(),{cache:"no-store"});const t=(await r.text()).trim();let remote=null;if(t){try{remote=JSON.parse(t)}catch(e){}}
const before=JSON.stringify(S);if(remote&&remote.S){S=mergeS(S,remote.S);const D=S.dc;rebuild();localStorage.setItem(K,JSON.stringify(S))}
const out=JSON.stringify({app:"safemlo",v:2,at:Date.now(),S:{dc:S.dc,dm:S.dm,missed:S.missed,bm:S.bm,conf:S.conf,fc:S.fc,plan:S.plan,ts:S.ts,exams:S.exams}});
const remoteSame=remote&&JSON.stringify(mergeS(remote.S,S))===JSON.stringify(remote.S);
if(!remoteSame){const pr=await fetch(SYNC_URL+"update/",{method:"POST",body:new URLSearchParams({key:syncKey(c),value:out}),keepalive:out.length<60000});const j=await pr.json();if(j.status!=1)throw new Error("write failed")}
localStorage.removeItem(SK+"_dirty");setStatus("Synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
if(JSON.stringify(S)!==before&&!document.querySelector(".opt,#ma,#fl2,#bk .btn"))nav(curTab||"dash")}
catch(e){setStatus("Sync failed (will retry): "+e.message)}finally{syncBusy=false}}
window.syncDirty=()=>{if(!syncCode())return;localStorage.setItem(SK+"_dirty","1");clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,8000)};
function genCode(){const a="abcdefghjkmnpqrstuvwxyz23456789",r=crypto.getRandomValues(new Uint8Array(20));let s="";r.forEach((x,i)=>{s+=a[x%a.length];if(i%5==4&&i<19)s+="-"});return s}
function setSync(c){c=(c||"").trim().toLowerCase();if(c&&syncKey(c).length<28){alert("Sync code must be at least 20 letters/numbers.");return}if(c)localStorage.setItem(SK,c);else localStorage.removeItem(SK);setStatus(c?"Connecting…":"Sync off");nav("dash");syncNow()}
function syncCard(){const c=syncCode();return `<div class="card"><h3>☁️ Sync across devices</h3>${c?`<p>Sync code: <code style="font-size:1rem">${c}</code></p><p><small id="syncst">${localStorage.getItem(SK+"_st")||""}</small></p><button class="btn" onclick="syncNow()">Sync now</button><button class="btn alt" onclick="if(confirm('Turn off sync on this device? (Progress stays here.)'))setSync('')">Turn off</button>`:
`<p>Enter the same sync code on your phone and computer to share progress. No account needed.</p><p><input id="sc" placeholder="xxxxx-xxxxx-xxxxx-xxxxx" style="font-size:1rem;padding:8px;width:260px" autocapitalize="off" autocorrect="off"></p><button class="btn" onclick="setSync($('sc').value)">Use this code</button><button class="btn alt" onclick="$('sc').value=genCode()">Generate new code</button>`}</div>`}
window.addEventListener("online",syncNow);document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="hidden"&&localStorage.getItem(SK+"_dirty"))syncNow();if(document.visibilityState=="visible")syncNow()});
setInterval(()=>{if(localStorage.getItem(SK+"_dirty"))syncNow()},60000);
if("serviceWorker" in navigator&&location.protocol!="file:")navigator.serviceWorker.register("sw.js");
nav("dash");syncNow();
</script></body></html>
